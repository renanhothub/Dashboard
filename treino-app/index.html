<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Treino Pro</title>
    <style>
      /* Tela de carregamento: aparece até o app ficar pronto (o React substitui o conteúdo de #root) */
      html, body { margin: 0; background: #0b0c0f; }
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0b0c0f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .splash svg { width: 96px; height: 96px; animation: lift 1.4s ease-in-out infinite; }
      .splash p { margin: 0; color: #e8c35a; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; }
      .splash .bar { width: 140px; height: 4px; border-radius: 4px; background: #262a33; overflow: hidden; }
      .splash .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #e8c35a; animation: load 1.1s ease-in-out infinite; }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body class="bg-ink-950">
    <div id="root">
      <div class="splash" role="status" aria-label="Carregando">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#12141a" />
          <g fill="#e8c35a">
            <rect x="96" y="236" width="320" height="40" rx="12" />
            <rect x="120" y="176" width="44" height="160" rx="14" />
            <rect x="348" y="176" width="44" height="160" rx="14" />
            <rect x="72" y="206" width="36" height="100" rx="12" />
            <rect x="404" y="206" width="36" height="100" rx="12" />
          </g>
        </svg>
        <p>TREINO PRO</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
