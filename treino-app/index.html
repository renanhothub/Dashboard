<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evolution" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Evolution</title>
    <style>
      /* Tela de abertura: aparece até o app ficar pronto (o React substitui o conteúdo de #root) */
      html, body { margin: 0; background: #0b0b0d; }
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 38%, #1d1708 0%, #0b0b0d 62%); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .splash .mark { overflow: visible; width: min(52vw, 230px); height: auto; max-height: 46vh; margin-bottom: 14px; animation: neon-on 1.6s ease-out both; }
      .splash h1 { margin: 0 0 0 0.22em; color: #fff4d6; font-size: clamp(20px, 6.4vw, 30px); font-weight: 800; letter-spacing: 0.22em; text-align: center; text-shadow: 0 0 10px rgba(244, 197, 74, 0.75), 0 0 28px rgba(244, 197, 74, 0.35); animation: neon-on 1.6s 0.25s ease-out both; }
      .splash p { margin: -8px 0 0; color: #8b8b95; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; animation: fade 1s 0.8s both; }
      .splash .bar { width: 140px; height: 3px; margin-top: 10px; border-radius: 3px; background: #2a2416; overflow: hidden; animation: fade 1s 0.8s both; }
      .splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #f4c54a; box-shadow: 0 0 8px #f4c54a; animation: load 1.1s ease-in-out infinite; }
      /* efeito de letreiro neon acendendo */
      @keyframes neon-on { 0% { opacity: 0; } 12% { opacity: 0.9; } 18% { opacity: 0.2; } 30% { opacity: 1; } 36% { opacity: 0.5; } 48%, 100% { opacity: 1; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .splash * { animation: none !important; } }
    </style>
  </head>
  <body class="bg-ink-950">
    <div id="root">
      <div class="splash" role="status" aria-label="Carregando o Evolution">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="60 76 392 416" class="mark"><defs><filter id="sg" filterUnits="userSpaceOnUse" x="-200" y="-200" width="912" height="912"><feGaussianBlur stdDeviation="11"/></filter></defs>
  <g fill="none" stroke="#f4c54a" stroke-width="23.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg)" opacity="0.8"><line x1="92" y1="352" x2="420" y2="352"/>
      <rect x="155" y="317" width="30" height="70" rx="12.6"/><rect x="215" y="292" width="30" height="120" rx="12.6"/><rect x="275" y="267" width="30" height="170" rx="12.6"/><rect x="335" y="242" width="30" height="220" rx="12.6"/>
      <path d="M 118 238 L 212 178 L 262 206 L 388 110"/><path d="M 330 108 L 390 108 L 390 166"/></g>
  <g fill="none" stroke="#f4c54a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><line x1="92" y1="352" x2="420" y2="352"/>
      <rect x="155" y="317" width="30" height="70" rx="12.6"/><rect x="215" y="292" width="30" height="120" rx="12.6"/><rect x="275" y="267" width="30" height="170" rx="12.6"/><rect x="335" y="242" width="30" height="220" rx="12.6"/>
      <path d="M 118 238 L 212 178 L 262 206 L 388 110"/><path d="M 330 108 L 390 108 L 390 166"/></g>
  <g fill="none" stroke="#fff7df" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"><line x1="92" y1="352" x2="420" y2="352"/>
      <rect x="155" y="317" width="30" height="70" rx="12.6"/><rect x="215" y="292" width="30" height="120" rx="12.6"/><rect x="275" y="267" width="30" height="170" rx="12.6"/><rect x="335" y="242" width="30" height="220" rx="12.6"/>
      <path d="M 118 238 L 212 178 L 262 206 L 388 110"/><path d="M 330 108 L 390 108 L 390 166"/></g></svg>
        <h1>EVOLUTION</h1>
        <p>Evolua a cada treino</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
